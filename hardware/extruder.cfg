[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 7.5  # calibreren!
nozzle_diameter: 0.4
filament_diameter: 1.75

heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0

control: pid
min_temp: 0
max_temp: 260

[tmc2209 extruder]
uart_pin: PC11
run_current: 0.7
stealthchop_threshold: 999999
